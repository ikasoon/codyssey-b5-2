[project]
name = "mini-git"
version = "0.1.0"
description = "커밋 그래프와 알고리즘을 학습하는 메모리 기반 Mini Git"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.8,<8",
    "mypy>=2.4,<3",
    "pytest>=8.3,<10",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["main.py", "mini_git"]
strict = true
disallow_any_explicit = true
enable_error_code = ["exhaustive-match"]

[tool.coverage.run]
branch = true
source = ["mini_git", "main"]

[tool.coverage.report]
show_missing = true
precision = 2
